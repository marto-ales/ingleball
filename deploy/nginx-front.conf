# Ejemplo de virtual host para el nginx que hace de proxy reverso (en el host,
# fuera del LXC). Copiar a /etc/nginx/sites-available/ingleball y enlazar:
#   sudo ln -s /etc/nginx/sites-available/ingleball /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name futbol.ejemplo.com;
    location / { return 301 https://$server_name$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name futbol.ejemplo.com;

    # ssl_certificate     /etc/nginx/ssl/futbol.ejemplo.com/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/futbol.ejemplo.com/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://192.168.1.50:8000;   # <- IP del LXC en el bridge de Proxmox
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}